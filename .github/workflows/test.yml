name: Test

# The plain job, on Ubuntu and Windows (no Blender; the tests themselves use no network, only apt installs bsdtar
# and pip installs ruff): the unit tests with the no-bpy guard, the tools, the landing page, the license files and
# the scene packs; the scan of tests/fixtures/ and tests/fixtures/packs/ for user names, computer names and user
# paths; ruff. Then on each Blender of the matrix: build, validate, the license text in the zip, the register
# smoke test, the import smoke test on tests/fixtures/*.max and the fixture tests (tests/blender/run.py) once
# they exist.
#
# Runs on pull requests and by hand. On a push to main it runs as the first job of the Publish workflow, which
# calls this file: nothing is published unless it passes, and the tests do not run twice.

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Plain Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A reader that only works on one operating system must not ship: the users are on both.
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # 3.11: the Python of Blender 4.2 and 4.5, the oldest the add-on runs on.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # bsdtar for the .rar and .7z tests of the scene packs: ubuntu-latest has no bsdtar and no unrar, and its
      # 7z is a shell wrapper or below the version MaxDrop accepts; those cases print SKIPPED. On Windows the
      # unpacker is the tar.exe of System32.
      - name: bsdtar
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libarchive-tools >/dev/null
          bsdtar --version
      # The real-tool tests of the scene packs print one RAN or SKIPPED line per case.
      - name: The unit tests and the no-bpy guard, the tools, the landing page, the license files, the scene packs
        run: python -I -m unittest discover tests
      - name: Fixture scan (user names, computer names, user paths)
        run: python -I tools/check_fixture.py "tests/fixtures/*.*" "tests/fixtures/packs/*"
      - name: Ruff
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q ruff==0.17.5
          ruff check --output-format=github .

  # Branch protection on main requires a check named "Plain Python": the matrix jobs above carry the operating
  # system in their names, so this job keeps that name and passes only when every one of them passed.
  python-gate:
    name: Plain Python
    needs: python
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every operating system passed
        env:
          RESULT: ${{ needs.python.result }}
        run: |
          echo "plain Python jobs: $RESULT"
          test "$RESULT" = success

  blender:
    name: Blender ${{ matrix.blender }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The three LTS lines the manifest's blender_version_min = 4.2.0 covers: all three must pass, the
        # manifest only claims what is tested.
        blender: ["4.2.23", "4.5.16", "5.2.4"]
    env:
      BLENDER_VERSION: ${{ matrix.blender }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache Blender
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/blender
          key: blender-${{ matrix.blender }}-linux-x64

      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          series=${BLENDER_VERSION%.*}
          mkdir -p ~/blender
          curl -fsSL "https://download.blender.org/release/Blender$series/blender-$BLENDER_VERSION-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1

      # Blender links X11/GL libraries even when it runs headless.
      - name: Libraries Blender links
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1 >/dev/null

      - name: Build, validate, index, make the landing page
        run: |
          set -euo pipefail
          B=~/blender/blender
          version=$(grep -m1 -oP '^version\s*=\s*"\K[^"]+' maxdrop/blender_manifest.toml)
          mkdir -p dist
          "$B" --factory-startup --command extension build --source-dir maxdrop --output-dir dist
          "$B" --factory-startup --command extension validate "dist/maxdrop-$version.zip"
          # The GPL text travels with the add-on.
          python3 tools/check_zip.py "dist/maxdrop-$version.zip"
          "$B" --factory-startup --command extension server-generate --repo-dir dist
          python3 tools/make_site.py dist
          test -s dist/index.html

      - name: Register smoke test
        run: |
          BLENDER_USER_RESOURCES="$RUNNER_TEMP/blender-profile" ~/blender/blender --background --factory-startup \
            --python-exit-code 1 --python tests/smoke_register.py

      # Every tests/fixtures/*.max through the operator, also from a .zip pack; exits 1 on IMPORT FAILED.
      - name: Import smoke test
        run: |
          BLENDER_USER_RESOURCES="$RUNNER_TEMP/blender-profile" ~/blender/blender --background --factory-startup \
            --python-exit-code 1 --python tests/smoke_import.py

      # The fixtures through the new pipeline, compared with their 3ds Max oracle; runs once the file exists.
      - name: Fixture tests
        if: hashFiles('tests/blender/run.py') != ''
        run: |
          BLENDER_USER_RESOURCES="$RUNNER_TEMP/blender-profile" ~/blender/blender --background --factory-startup \
            --python-exit-code 1 --python tests/blender/run.py
