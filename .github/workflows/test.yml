name: Test

# The plain job, on Ubuntu and Windows, each with the Python and numpy of the oldest and of the newest supported
# Blender (no Blender; the tests themselves use no network, only apt installs bsdtar, pip installs numpy and
# ruff, and on Linux UnRAR and 7-Zip come from their vendors): the unit tests with the no-bpy guard, the tools,
# the landing page, the license files and the scene packs; the scan of every file under tests/fixtures/ for user
# names, computer names and user paths; ruff. Then on each Blender of the matrix: build, validate, the license
# text in the zip, the register smoke test, the import smoke test on tests/fixtures/*.max and the fixture tests
# (tests/blender/run.py).
#
# Runs on pull requests and by hand. On a push to main it runs as the first job of the Publish workflow, which
# calls this file: nothing is published unless it passes, and the tests do not run twice.

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Plain Python (${{ matrix.os }}, Python ${{ matrix.python }}, numpy ${{ matrix.numpy }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A reader that only works on one operating system must not ship: the users are on both.
        os: [ubuntu-latest, windows-latest]
        # The numpy of Blender 4.2 (1.24.3) and of 5.2 (2.3.4); 4.5 ships 1.26.4, between the two. The geometry
        # readers return numpy arrays: without numpy their tests skip.
        numpy: ["1.24.3", "2.3.4"]
        # Each numpy on the Python of the same Blender: 4.2 and 4.5 ship 3.11, 5.2 ships 3.13 (a stdlib call 3.13
        # removed or changed fails here, not only in the Blender job's smoke tests).
        include:
          - numpy: "1.24.3"
            python: "3.11"
          - numpy: "2.3.4"
            python: "3.13"
    defaults:
      run:
        shell: bash
    # The UnRAR and 7-Zip the Linux entries install (step "UnRAR and 7-Zip"); the cache key is made of the
    # checksums, so a new version is these four values only.
    env:
      SEVENZIP_URL: https://github.com/ip7z/7zip/releases/download/26.06/7z2606-linux-x64.tar.xz
      SEVENZIP_SHA256: 2b539cf067b2ad48e1baa5093dbaa8818b73542d1222a0ffde9dc5f2922ea62e
      UNRAR_URL: https://www.rarlab.com/rar/rarlinux-x64-723.tar.gz
      UNRAR_SHA256: 759b4b6aa0d9f77131882162951193f3a0e54bf60e1d8dc4255aa308accab588
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # bsdtar for the .rar and .7z tests of the scene packs (ubuntu-latest has none). On Windows the unpacker is
      # the tar.exe of System32, and UnRAR and 7-Zip are whatever the image holds: their cases may print SKIPPED.
      - name: bsdtar
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libarchive-tools >/dev/null
          bsdtar --version
      # UnRAR and 7-Zip for the real-tool tests (ubuntu-latest has no unrar, and its 7z is a shell wrapper or below
      # external.FLOORS): the vendors' Linux builds, pinned by version and SHA-256, into /usr/local/bin, a standard
      # place of external.candidates, so the tests find them the way MaxDrop does. 7-Zip from the release the
      # download page of 7-zip.org links (the author's ip7z/7zip on GitHub), UnRAR from rarlab.com's RAR for Linux
      # (UnRAR is freeware, its banner says so, and 3a of the package's license.txt excepts the UnRAR components;
      # the trial `rar` is not installed). A
      # new version: the job's env above, at or above external.FLOORS. The tarballs are cached by checksum, so a
      # vendor outage fails the job only when no cached copy exists; the checksum is checked after a restore too.
      - name: Cache UnRAR and 7-Zip
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/unpackers
          key: unpackers-${{ env.SEVENZIP_SHA256 }}-${{ env.UNRAR_SHA256 }}
      - name: UnRAR and 7-Zip
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          dl=~/unpackers
          mkdir -p "$dl"
          fetch() {
            test -s "$dl/$2" || curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 \
              -o "$dl/$2" "$1"
          }
          fetch "$SEVENZIP_URL" 7z-linux-x64.tar.xz
          fetch "$UNRAR_URL" rarlinux-x64.tar.gz
          printf '%s  %s\n' "$SEVENZIP_SHA256" "$dl/7z-linux-x64.tar.xz" "$UNRAR_SHA256" "$dl/rarlinux-x64.tar.gz" \
            | sha256sum --strict -c -
          work="$RUNNER_TEMP/unpackers"
          mkdir -p "$work"
          tar -xJf "$dl/7z-linux-x64.tar.xz" -C "$work" 7zz
          tar -xzf "$dl/rarlinux-x64.tar.gz" -C "$work" rar/unrar
          sudo install -m 0755 "$work/7zz" /usr/local/bin/7zz
          sudo install -m 0755 "$work/rar/unrar" /usr/local/bin/unrar
          # Run without arguments each prints its banner and usage; the exit code is not the check, the banner is.
          banner=$(/usr/local/bin/7zz </dev/null 2>&1 || true)
          printf '%s\n' "$banner" | sed -n 1,4p
          grep -q '^7-Zip (z) 26\.06 ' <<<"$banner"
          banner=$(/usr/local/bin/unrar </dev/null 2>&1 || true)
          printf '%s\n' "$banner" | sed -n 1,4p
          grep -q '^UNRAR 7\.23 ' <<<"$banner"
      # Exactly the pinned Python and numpy, imported the way the tests run (-I): a failed install fails here
      # instead of turning the numpy tests into skips.
      - name: numpy
        env:
          NUMPY: ${{ matrix.numpy }}
          PYTHON: ${{ matrix.python }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q "numpy==$NUMPY"
          python -I -c '
          import os, sys, numpy
          p = "%d.%d" % sys.version_info[:2]
          v = numpy.__version__
          print("Python", sys.version, "numpy", v)
          assert p == os.environ["PYTHON"], p
          assert v == os.environ["NUMPY"], v
          '
      # The real-tool tests of the scene packs print the program each uses and one RAN or SKIPPED line per case;
      # on Linux MAXDROP_REQUIRE_TOOLS turns a missing program of those installed above into a failure, so a
      # broken install cannot pass silently. The fuzz slices (tests/unit/test_fuzz.py, tests/test_intake_fuzz.py)
      # run the first cases of tests/unit/fuzz.py in a child process each: MAXDROP_FUZZ_CASES and
      # MAXDROP_FUZZ_ZIP_CASES make them longer; the default keeps the step under two minutes.
      - name: The unit tests and the no-bpy guard, the tools, the landing page, the license files, the scene packs
        env:
          MAXDROP_REQUIRE_TOOLS: ${{ runner.os == 'Linux' && 'unrar,7z,bsdtar' || '' }}
        run: python -I -m unittest discover tests
      - name: Fixture scan (user names, computer names, user paths)
        run: python -I tools/check_fixture.py "tests/fixtures/**/*"
      # Once: ruff does not depend on numpy. Its version is `required-version` in pyproject.toml, the one place
      # it is written; tools/lint.py is the command block 1 of build-and-test runs locally.
      - name: Ruff
        if: runner.os == 'Linux' && startsWith(matrix.numpy, '2.')
        run: |
          set -euo pipefail
          pin=$(grep -m1 -oP '^required-version\s*=\s*"\K==[^"]+' pyproject.toml)
          test -n "$pin"
          python -m pip install --disable-pip-version-check -q "ruff$pin"
          python -I tools/lint.py --output-format=github .

  # Branch protection on main requires a check named "Plain Python": the matrix jobs above carry the operating
  # system, the Python and the numpy version in their names, so this job keeps that name and passes only when
  # every one of them passed.
  python-gate:
    name: Plain Python
    needs: python
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every matrix entry passed
        env:
          RESULT: ${{ needs.python.result }}
        run: |
          echo "plain Python jobs: $RESULT"
          test "$RESULT" = success

  blender:
    name: Blender ${{ matrix.blender }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The three LTS lines the manifest's blender_version_min = 4.2.0 covers: all three must pass, the
        # manifest only claims what is tested.
        blender: ["4.2.23", "4.5.16", "5.2.4"]
    env:
      BLENDER_VERSION: ${{ matrix.blender }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache Blender
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/blender
          key: blender-${{ matrix.blender }}-linux-x64

      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          series=${BLENDER_VERSION%.*}
          mkdir -p ~/blender
          curl -fsSL "https://download.blender.org/release/Blender$series/blender-$BLENDER_VERSION-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1

      # Blender links X11/GL libraries even when it runs headless.
      - name: Libraries Blender links
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1 >/dev/null

      - name: Build, validate, index, make the landing page
        run: |
          set -euo pipefail
          B=~/blender/blender
          version=$(grep -m1 -oP '^version\s*=\s*"\K[^"]+' maxdrop/blender_manifest.toml)
          mkdir -p dist
          "$B" --factory-startup --command extension build --source-dir maxdrop --output-dir dist
          "$B" --factory-startup --command extension validate "dist/maxdrop-$version.zip"
          # The GPL text travels with the add-on.
          python3 tools/check_zip.py "dist/maxdrop-$version.zip"
          "$B" --factory-startup --command extension server-generate --repo-dir dist
          python3 tools/make_site.py dist
          test -s dist/index.html

      - name: Register smoke test
        run: |
          BLENDER_USER_RESOURCES="$RUNNER_TEMP/blender-profile" ~/blender/blender --background --factory-startup \
            --python-exit-code 1 --python tests/smoke_register.py

      # Every tests/fixtures/*.max through the operator, also from a .zip pack; exits 1 on IMPORT FAILED.
      - name: Import smoke test
        run: |
          BLENDER_USER_RESOURCES="$RUNNER_TEMP/blender-profile" ~/blender/blender --background --factory-startup \
            --python-exit-code 1 --python tests/smoke_import.py

      # The fixtures through the new pipeline, compared with their 3ds Max oracle. No file gate: a renamed or
      # deleted run.py fails the job instead of turning the fixture tests off.
      - name: Fixture tests
        run: |
          BLENDER_USER_RESOURCES="$RUNNER_TEMP/blender-profile" ~/blender/blender --background --factory-startup \
            --python-exit-code 1 --python tests/blender/run.py
